name: Check Website

on:
  pull_request:
    branches:
      - docs
  push:
    branches:
      - polyfem-user-guide
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Test preview publisher safety
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate JSON specification documentation
        run: |
          git clone --depth=1 https://github.com/polyfem/polyfem.git
          git clone --depth=1 https://github.com/polyfem/polysolve.git
          git clone --depth=1 https://github.com/geometryprocessing/json-spec-engine.git
          python -m pip install -r ./json-spec-engine/requirements.txt
          python ./json-spec-engine/docs/spec2html.py -i ./polyfem/json-specs/input-spec.json --include-dirs ./polyfem/json-specs ./polysolve -o ./docs/_json_spec.md
          python ./json-spec-engine/scripts/generate_defaults.py -i ./polyfem/json-specs/input-spec.json --include-dirs ./polyfem/json-specs ./polysolve -o ./docs/_json_defaults.json
          cp ./polyfem/LICENSE ./docs/_polyfem_license.txt

      - name: Build MkDocs
        run: |
          if [ "$GITHUB_REF" = refs/heads/polyfem-user-guide ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            python -m mkdocs build --config-file mkdocs-preview.yml --site-dir preview-site
          else
            python -m mkdocs build
          fi

      - name: Upload preview snapshot
        if: github.ref == 'refs/heads/polyfem-user-guide' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: user-guide-preview
          path: preview-site/
          if-no-files-found: error
          retention-days: 14

  preview:
    needs: build
    if: github.ref == 'refs/heads/polyfem-user-guide' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    # Share the production publisher's lock; never cancel a running deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source

      - name: Checkout current published site
        uses: actions/checkout@v4
        with:
          ref: main
          path: published

      - name: Download preview snapshot
        uses: actions/download-artifact@v4
        with:
          name: user-guide-preview
          path: preview-site

      - name: Confirm existing Pages configuration
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"
          python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "pages.json")) as stream:
              pages = json.load(stream)
          assert pages["build_type"] == "legacy", "Pages source changed; review before publishing"
          assert pages["source"] == {"branch": "main", "path": "/"}, "Unexpected Pages source"
          assert pages["html_url"] == "https://polyfem.github.io/", "Unexpected Pages URL"
          PY

      - name: Publish only the preview directory
        run: python source/.github/scripts/publish_preview.py preview-site published

      - name: Request Pages rebuild
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Verify live preview
        run: python source/.github/scripts/verify_preview.py

      - name: Link to preview
        run: |
          echo 'Preview: https://polyfem.github.io/previews/polyfem-user-guide/' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
