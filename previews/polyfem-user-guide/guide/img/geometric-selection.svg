<title id="title">Geometric selection on a triangular strip</title><desc id="desc">Each panel shows the same mesh with x from 0 to 4 and y from 0 to 1. Shading is the query region; orange edges have barycenters inside it. Box selects the left end, circle selects a corner patch, half-space selects the left end and portions of the top and bottom.</desc>
